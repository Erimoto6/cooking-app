{% extends "base.html" %}

{% block title %}Welcome - Dishly{% endblock %}

{% block styles %}
<style>
  @keyframes w-fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes w-float {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(5deg); }
  }

  .w-screen {
    min-height: 100vh;
    background: #0f0500;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
    overflow: hidden;
  }

  .w-bg-blob {
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, #6B1A00 0%, transparent 70%);
    top: -150px;
    right: -150px;
    opacity: 0.4;
    pointer-events: none;
  }

  .w-bg-blob2 {
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, #3D0E00 0%, transparent 70%);
    bottom: -100px;
    left: -100px;
    opacity: 0.3;
    pointer-events: none;
  }

  .w-logo {
    font-size: 80px;
    margin-bottom: 20px;
    animation: w-float 4s ease-in-out infinite;
  }

  .w-title {
    font-size: 48px;
    font-family: 'Georgia', serif;
    font-style: italic;
    font-weight: bold;
    color: #ffffff;
    margin-bottom: 12px;
    text-align: center;
  }

  .w-subtitle {
    font-size: 16px;
    color: rgba(255,255,255,0.5);
    text-align: center;
    margin-bottom: 48px;
  }

  .w-card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 28px;
    padding: 32px 24px;
    width: 100%;
    max-width: 340px;
    animation: w-fadeIn 0.6s ease forwards;
  }

  .w-btn {
    width: 100%;
    padding: 14px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    margin-bottom: 16px;
    border: none;
  }

  .w-btn-primary {
    background: #C0392B;
    color: white;
  }

  .w-btn-primary:active {
    transform: scale(0.97);
    background: #a93226;
  }

  .w-btn-outline {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.3);
    color: rgba(255,255,255,0.9);
  }

  .w-btn-outline:active {
    transform: scale(0.97);
    background: rgba(255,255,255,0.05);
  }

  .w-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
  }

  .w-divider-line {
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.1);
  }

  .w-divider-text {
    font-size: 12px;
    color: rgba(255,255,255,0.3);
  }

  .w-footer {
    margin-top: 24px;
    text-align: center;
  }

  .w-footer a {
    color: rgba(255,255,255,0.5);
    font-size: 13px;
    text-decoration: none;
  }
</style>
{% endblock %}

{% block content %}
<div class="w-screen">
  <div class="w-bg-blob"></div>
  <div class="w-bg-blob2"></div>

  <div class="w-logo">🍳</div>
  <h1 class="w-title">Dishly</h1>
  <p class="w-subtitle">Your personal recipe companion</p>

  <div class="w-card">
    <a href="{{ url_for('signup') }}">
      <button class="w-btn w-btn-primary">Get Started</button>
    </a>

    <div class="w-footer">
      <a href="{{ url_for('login')">Already have an account? Log in</a>
    </div>
  </div>
</div>
{% endblock %}
